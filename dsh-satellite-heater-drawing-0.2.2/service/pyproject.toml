[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "heater-drawing-service"
version = "0.1.0"
description = "Contract foundation for the rectangular heater drawing service"
readme = {text = "Contract foundation for the rectangular heater drawing service.", content-type = "text/markdown"}
requires-python = ">=3.12,<3.13"
dependencies = [
  "ezdxf>=1.4,<2",
  "fastapi>=0.120,<1",
  "matplotlib>=3.10,<4",
  "openpyxl>=3.1,<4",
  "pydantic>=2.11,<3",
  "PyMuPDF>=1.26,<2",
  "pypdf>=6,<7",
]

[dependency-groups]
dev = [
  "build>=1.3,<2",
  "jsonschema>=4.26,<5",
  "pytest>=8.4,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/heater_drawing"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["../tests"]
