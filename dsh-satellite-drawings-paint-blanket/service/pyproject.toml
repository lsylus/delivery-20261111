[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"
[project]
name = "thermal-drawings-service"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["cryptography==46.0.5", "fastapi==0.136.3", "uvicorn==0.38.0", "ezdxf==1.4.5", "jsonschema==4.24.0", "shapely==2.1.2", "satellite-geometry-core==0.1.0"]
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"thermal_drawings.drawing" = ["drawing.schema.json"]

"thermal_drawings.domain" = ["schemas/*.json"]
