  const regions=base.map(r=>{

    const detected=r.type!=='contact'||r.gap<tolerance||(r.gap===0&&tolerance===0);
    const enabled=r.type==='hole'?!!o.protectHoles:r.type==='boss'?!!o.protectBosses:true;
    const active=!excluded&&detected&&enabled;
    const reason=excluded?'人工排除':!enabled?'类别保护已关闭':!detected?`间隙 ${fmt(r.gap)} mm 超出识别阈值`:'已纳入保护';
    return {...r,excluded,detected,enabled,active,reason,margin:r.type==='boss'?0:margin};

  regions.forEach(r=>{

    const attrs=`fill="${fill}" stroke="${edge}" stroke-width="${selected?2:1}" ${r.active?'':'stroke-dasharray="3 2"'}`;
    content+=`<g data-region="${esc(r.id)}" data-source="${r.sourceId}" data-active="${r.active}" tabindex="0" role="button" aria-label="${esc(r.source+' '+r.label+' '+r.reason)}" style="cursor:pointer"><title>${esc(r.source+' / '+r.label+' / '+r.reason+(r.type==='contact'?' / 间隙 '+fmt(r.gap)+' mm':''))}</title>`;

      else content+=circle(px(r.cx),py(r.cy),2.1*S,`fill="white" stroke="${C.muted}" stroke-width=".6"`);
      content+=line(px(r.cx)-9,py(r.cy),px(r.cx)+9,py(r.cy),`stroke="${C.muted}" stroke-width=".6"`)+line(px(r.cx),py(r.cy)-9,px(r.cx),py(r.cy)+9,`stroke="${C.muted}" stroke-width=".6"`);
    } else {
      content+=rect(px(r.x-margin),py(r.y-margin),(r.width+2*margin)*S,(r.height+2*margin)*S,`rx="1" ${attrs}`);

  content+=rect(29,441,16,10,`fill="${o.hatch?`url(#${id}-hatch)`:'#ffe9b8'}" stroke="${C.amber}" stroke-width=".7"`)+text(53,450,'保护区域',`fill="${C.muted}" font-size="11"`);

const faceNames={top:'顶面',front:'前侧',back:'后侧',left:'左侧',right:'右侧'};

/** Five-panel hat pattern; folded 3D shape and fabrication data remain demonstration-only. */
function blanketDrawing(options={}) {
  const o={width:140,depth:100,height:85,allowance:5,lap:15,seam:'back-right',faces:['top','front','back','left','right'],selectedFace:'top',dimensions:true,fixed:true,...options};
  const width=num(o.width,140,30,500),depth=num(o.depth,100,30,500),height=num(o.height,85,15,300),allowance=num(o.allowance,5,0,20),lap=num(o.lap,15,0,50);
  const ratio=1+allowance/100,W=width*ratio,D=depth*ratio,H=height*ratio;
  const faces=new Set(o.faces||[]);
  const all=[{id:'top',x:H,y:H,width:W,height:D},{id:'back',x:H,y:0,width:W,height:H},{id:'front',x:H,y:H+D,width:W,height:H},{id:'left',x:0,y:H,width:H,height:D},{id:'right',x:H+W,y:H,width:H,height:D}];
  const panels=all.filter(p=>faces.has(p.id)).map(p=>({...p,label:faceNames[p.id]}));
  const totalW=W+2*H,totalH=D+2*H;
  const scale=Math.min(474/(totalW+2*lap),314/(totalH+2*lap));
  const X=320-totalW*scale/2,Y=233-totalH*scale/2;
  const px=v=>X+v*scale,py=v=>Y+v*scale;
  const id=`blanket-${++drawingId}`;
  const defs=`<pattern id="${id}-lap" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(42)">${rect(0,0,6,6,'fill="#fff6e3"')}${line(0,0,0,6,`stroke="#dfb15d" stroke-width="1"`)}</pattern>`;
  let content=frame('热控多层展开图','MLI / DEMO / REV. A',`${panels.length} 面帽式包覆 · 展开预览`);
  const tabs=[];
  const addTab=(face,edge,x,y,w,h,pair)=>{if(faces.has(face)&&faces.has(pair)&&lap>0)tabs.push({face,edge,x,y,width:w,height:h,pair});};
  if(o.seam==='front-left') {
    addTab('left','north',0,H-lap,H,lap,'back');addTab('left','south',0,H+D,H,lap,'front');
    addTab('right','north',H+W,H-lap,H,lap,'back');addTab('right','south',H+W,H+D,H,lap,'front');
  } else if(o.seam==='opposite') {
    addTab('back','west',H-lap,0,lap,H,'left');addTab('front','east',H+W,H+D,lap,H,'right');
    addTab('left','south',0,H+D,H,lap,'front');addTab('right','north',H+W,H-lap,H,lap,'back');
  } else {
    addTab('back','west',H-lap,0,lap,H,'left');addTab('back','east',H+W,0,lap,H,'right');
    addTab('front','west',H-lap,H+D,lap,H,'left');addTab('front','east',H+W,H+D,lap,H,'right');
  }
  // A clipped corner on each tab makes the cutting pattern visually and geometrically readable.
  tabs.forEach(t=>{
    const x=px(t.x),y=py(t.y),w=t.width*scale,h=t.height*scale,k=Math.min(4,w/3,h/3);
    const points=`${x+k},${y} ${x+w-k},${y} ${x+w},${y+k} ${x+w},${y+h-k} ${x+w-k},${y+h} ${x+k},${y+h} ${x},${y+h-k} ${x},${y+k}`;
    content+=`<polygon points="${points}" fill="url(#${id}-lap)" stroke="${C.amber}" stroke-width="1" data-tab-face="${t.face}"><title>${faceNames[t.face]} → ${faceNames[t.pair]}，搭接 ${fmt(lap)} mm</title></polygon>`;
  });
  panels.forEach(p=>{
    const selected=o.selectedFace===p.id;
    const x=px(p.x),y=py(p.y),w=p.width*scale,h=p.height*scale;
    p.svgBounds={x,y,width:w,height:h};
    const labelSize=w>100?13:11;
    content+=`<g data-face="${p.id}" data-panel-x="${fmt(x)}" data-panel-y="${fmt(y)}" data-panel-width="${fmt(w)}" data-panel-height="${fmt(h)}" data-mm-width="${fmt(p.width)}" data-mm-height="${fmt(p.height)}" role="button" tabindex="0" aria-label="${p.label}，${fmt(p.width)}乘${fmt(p.height)}毫米" style="cursor:pointer">`;
    content+=rect(x,y,w,h,`fill="${selected?'#eaf2fd':'#f7f9fb'}" stroke="${selected?C.blue:C.ink}" stroke-width="${selected?1.8:1.15}"`);
    if(w>=30&&h>=22)content+=text(x+w/2,y+h/2-3,p.label,`fill="${selected?C.blue:C.ink}" font-size="${labelSize}" font-weight="600" text-anchor="middle"`);
    if(o.dimensions&&w>=66&&h>=44)content+=text(x+w/2,y+h/2+15,`${fmt(p.width)} × ${fmt(p.height)}`,`fill="${selected?'#7094bd':C.muted}" font-size="11" text-anchor="middle"`);
    content+='</g>';
  });
  const folds=[['back',H,H,H+W,H],['front',H,H+D,H+W,H+D],['left',H,H,H,H+D],['right',H+W,H,H+W,H+D]];
  if(faces.has('top'))folds.filter(f=>faces.has(f[0])).forEach(([,x1,y1,x2,y2])=>{content+=line(px(x1),py(y1),px(x2),py(y2),`stroke="#fff" stroke-width="2.6"`)+line(px(x1),py(y1),px(x2),py(y2),`stroke="${C.blue}" stroke-width="1.2" stroke-dasharray="6 4" pointer-events="none"`);});
  const defaultPoints=panels.map(p=>({id:`fixed-${p.id}`,face:p.id,u:.5,v:p.id==='top'?.18:.25}));
  const points=Array.isArray(o.fixedPoints)?o.fixedPoints:defaultPoints;
  const shownPoints=[];
  if(o.fixed)points.forEach((point,i)=>{
    const p=panels.find(p=>p.id===point.face);if(!p)return;
    const u=num(point.u,.5,.04,.96),v=num(point.v,.5,.04,.96);
    const cx=px(p.x+p.width*u),cy=py(p.y+p.height*v);
    shownPoints.push({...point,u,v});
    content+=`<g data-fixed-point="${esc(point.id||'fixed-'+i)}" data-face="${p.id}" style="cursor:pointer"><title>${p.label}固定点 ${i+1}</title>${circle(cx,cy,4.2,'fill="white" stroke="#3a87af" stroke-width="1.3"')}${circle(cx,cy,1.35,'fill="#3a87af"')}</g>`;
  });
  if(o.dimensions){
    content+=dimH(px(H),px(H+W),56,py(0)-3,fmt(W));
    content+=dimV(66,py(H),py(H+D),px(0)-3,fmt(D));
    content+=text(605,67,`放量 +${fmt(allowance)}%`,`fill="${C.muted}" text-anchor="end" font-size="11"`);
  }
  content+=text(320,416,'底面保持开口 · 点击裁片查看对应面',`fill="${C.muted}" font-size="11" text-anchor="middle"`);
  content+=line(28,443,45,443,`stroke="${C.ink}" stroke-width="1.1"`)+text(52,447,'裁切',`fill="${C.muted}" font-size="11"`);
  content+=line(100,443,120,443,`stroke="${C.blue}" stroke-dasharray="5 3"`)+text(127,447,'折叠',`fill="${C.muted}" font-size="11"`);
  content+=rect(177,437,15,11,`fill="url(#${id}-lap)" stroke="${C.amber}" stroke-width=".6"`)+text(200,447,'搭接',`fill="${C.muted}" font-size="11"`);
  content+=circle(267,442,3.5,'fill="white" stroke="#3a87af" stroke-width="1.1"')+text(278,447,'固定',`fill="${C.muted}" font-size="11"`);
  content+=text(28,474,`搭接 ${fmt(lap)} mm · 示例展开，需工艺确认`,`fill="${C.muted}" font-size="11"`);
  const faceArea=panels.reduce((sum,p)=>sum+p.width*p.height,0);
  const stats={panelCount:panels.length,scaledWidth:W,scaledDepth:D,scaledHeight:H,allowance,lap,tabCount:tabs.length,fixedPointCount:shownPoints.length,faceArea,faceAreaM2:faceArea/1e6,unscaledVolume:width*depth*height,scaledVolume:W*D*H,volumeRatio:ratio**3,patternWidth:totalW,patternHeight:totalH};
  return {svg:root(id,'热控多层五面包覆二维展开图',defs,content,{units:'mm',seam:o.seam,...stats}),panels,stats};
}

return {paintDrawing,blanketDrawing};
})();

function cleanState(s){
 if(!s||typeof s!=='object')throw new Error('Invalid configuration');
 const safe=structuredClone(defaults);
 for(const [key,value]of Object.entries(defaults)){if(typeof value==='boolean'&&typeof s[key]==='boolean')safe[key]=s[key];}
 const bounds=isPaint?{margin:[0,10],contactTolerance:[.01,.5]}:{allowance:[0,12],lap:[0,30]};
 for(const [key,[min,max]]of Object.entries(bounds)){if(!Number.isFinite(s[key]))throw new Error('Invalid parameter');safe[key]=Math.min(max,Math.max(min,s[key]));}
 safe.savedAt=typeof s.savedAt==='string'&&/^\d{2}:\d{2}$/.test(s.savedAt)?s.savedAt:null;
 safe.log=Array.isArray(s.log)?s.log.filter(x=>x&&typeof x.message==='string').slice(0,25).map(x=>({at:String(x.at||'').slice(0,8),message:x.message.slice(0,300)})):[];
 if(isPaint){safe.caseId=Object.keys(caseNames).includes(s.caseId)?s.caseId:'panel';safe.excludedIds=Array.isArray(s.excludedIds)?s.excludedIds.filter(x=>/^(unit-[ab]-[1-4]|hole-[1-8]|boss-[12]|bracket-1|pad-1)$/.test(x)):[];safe.selectedId=s.selectedId===null?null:/^(unit-[ab]-[1-4]|hole-[1-8]|boss-[12]|bracket-1|pad-1)$/.test(s.selectedId)?s.selectedId:'unit-a-1';safe.selectedObject=['panel','unit-a','unit-b','bracket','pad','boss'].includes(s.selectedObject)?s.selectedObject:'panel';}
 else{safe.seam=['front-left','back-right','opposite'].includes(s.seam)?s.seam:'front-left';safe.faces=Array.isArray(s.faces)?[...new Set(s.faces.filter(f=>['top','front','back','left','right'].includes(f)))]:defaults.faces;safe.selectedFace=['top','front','back','left','right'].includes(s.selectedFace)?s.selectedFace:'top';safe.fixedPoints=Array.isArray(s.fixedPoints)?s.fixedPoints.filter(p=>p&&/^FP-\d{2,5}$/.test(p.id)&&['top','front','back','left','right'].includes(p.face)&&Number.isFinite(p.u)&&Number.isFinite(p.v)).slice(0,300).map(p=>({id:p.id,face:p.face,u:Math.min(.94,Math.max(.06,p.u)),v:Math.min(.94,Math.max(.06,p.v))})):defaults.fixedPoints;}
 safe.view=defaults.view;safe.rightTab='params';safe.fixedEditing=false;return safe;
}

 return summary+checkItem('包覆范围',`${state.faces.length} 个面参与包覆，安装底面排除。`,state.faces.length===5?'五面包覆':'需确认',state.faces.length===5?'ok':'warning')+checkItem('裁片与搭接',`${s.panelCount} 个面片，${s.tabCount} 处搭接，宽度 ${state.lap} mm。`,s.tabCount&&state.lap?'已设置':'待调整',s.tabCount&&state.lap?'ok':'warning')+checkItem('固定点分布',`${s.fixedPointCount} 个可见固定点，位置由工程师调整。`,state.reviewed?'已复核':'需复核',state.reviewed?'ok':'pending')+checkItem('三维与展开版本',state.generated&&!state.dirty?'当前包覆参数与展开图已同步。':'包覆或接缝变更后，请更新展开图。',state.generated&&!state.dirty?'已同步':'待更新',state.generated&&!state.dirty?'ok':'pending')+`<div class="param-section"><h3 class="param-heading">包络体积参考</h3><div class="reference-line"><span>同比缩放的几何量</span><span class="reference-number">${s.volumeRatio.toFixed(3)}</span></div><p class="param-note">由线性系数的三次方计算，仅作参考，不代表贴合或工艺验收通过。</p></div>`+checkItem('局部干涉与材料适应性','需要真实模型、材料和工艺规则。','待验证')+checkItem('现场试装','本页面未进行实物裁剪与试装。','未进行')+`<div class="check-actions"><button class="btn block ${state.reviewed?'':'primary'}" data-action="review" ${!state.generated||state.dirty?'disabled':''}>${icon('shield')}${state.reviewed?'取消样例复核标记':'标记样例已人工复核'}</button></div>`;
}
function resultsPanel(){
 if(isPaint){const rows=drawing.regions.filter(r=>state.filter==='all'||r.type===state.filter||state.filter==='review'&&!r.active);return `<div class="results-header"><span class="result-title">保护区域<span class="count-pill">${drawing.stats.activeCount}</span></span><div class="result-tabs">${[['all','全部'],['contact','安装接触'],['hole','孔洞'],['boss','凸台'],['review','待确认']].map(([key,label])=>`<button class="${state.filter===key?'active':''}" data-filter="${key}">${label}</button>`).join('')}</div></div><div class="result-body"><table class="result-table"><thead><tr><th>区域</th><th>来源</th><th>类型</th><th>间隙 / mm</th><th>处理</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr class="${state.selectedId===r.id?'selected':''}" data-region="${r.id}" tabindex="0"><td class="code-name mono">${r.label}</td><td>${r.source}</td><td>${{contact:'安装接触',hole:'孔洞',boss:'凸台'}[r.type]}</td><td class="mono">${r.type==='contact'?r.gap.toFixed(2):'—'}</td><td>${chip(r.excluded?'人工排除':!r.detected?'待确认':!r.enabled?'未启用':'保护',r.active?'blue':r.excluded?'':'amber')}</td><td><button data-toggle-region="${r.id}" aria-label="${r.excluded?'恢复':'排除'} ${r.label}">${r.excluded?'恢复':'排除'}</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty-row">当前分类没有区域</td></tr>'}</tbody></table></div><div class="result-foot"><span>${drawing.stats.regionCount} 个候选 · ${drawing.stats.activeCount} 个保护区域 · ${drawing.stats.undetectedCount} 处间隙待确认</span><button class="btn text" data-action="reset-regions">恢复人工排除项</button></div>`;}
 return `<div class="results-header"><span class="result-title">裁片与固定点<span class="count-pill">${drawing.panels.length}</span></span><span class="flex gap-6" style="color:#9ba9bb;font-size:10px"><button class="btn text" data-action="fixed-mode">${icon('pin')}${state.fixedEditing?'完成固定点编辑':'固定点编辑'}</button></span></div><div class="result-body"><table class="result-table"><thead><tr><th>裁片</th><th>包覆面</th><th>展开尺寸 / mm</th><th>固定点</th><th>状态</th></tr></thead><tbody>${drawing.panels.map(p=>`<tr data-face="${p.id}" class="${state.selectedFace===p.id?'selected':''}" tabindex="0"><td class="code-name mono">F0${['top','front','back','left','right'].indexOf(p.id)+1}</td><td>${faceNames[p.id]}</td><td class="mono">${Number(p.width.toFixed(2))} × ${Number(p.height.toFixed(2))}</td><td class="mono">${state.fixedPoints.filter(f=>f.face===p.id).length}</td><td>${chip(state.reviewed?'已复核':'待复核',state.reviewed?'green':'blue')}</td></tr>`).join('')||'<tr><td colspan="5" class="empty-row">请至少选择一个包覆面</td></tr>'}</tbody></table></div><div class="result-foot"><span>${drawing.stats.panelCount} 个面片 · ${drawing.stats.tabCount} 处搭接 · ${drawing.stats.fixedPointCount} 个可见固定点</span><span>底面开口 · 单位 mm</span></div>`;

function refresh({skipRight=false}={}){
 drawing=isPaint?paintDrawing(state):blanketDrawing({...state,selectedFace:state.selectedFace,fixed:state.fixed});
 $('#drawing-stage').innerHTML=drawing.svg;
 $('#drawing-stage svg').style.transform=`scale(${drawingZoom})`;
 $('#model-panel').innerHTML=modelPanel();
 $('#results').innerHTML=resultsPanel();
 if(!skipRight)$('#params').innerHTML=paramsPanel();
 const activeStep=state.reviewed?4:state.generated&&!state.dirty?3:2;
 const steps=isPaint?['模型与表面','识别保护区','生成图纸','人工复核']:['对象与包覆面','生成片体','展开与搭接','人工复核'];
 $('#progress').innerHTML=steps.map((name,i)=>{const number=i+1,cls=number<activeStep||state.reviewed?'done':number===activeStep?'active':'idle';return `${i?'<span class="step-line"></span>':''}<div class="step ${cls}"><span class="step-circle">${cls==='done'?icon('check'):number.toString().padStart(2,'0')}</span><span class="step-text">${name}</span></div>`;}).join('')+`<span class="progress-meta">${state.dirty?`<span class="dirty-indicator">图纸待更新${dirtyEdit?' · 未保存':''}</span>`:dirtyEdit?'<span class="dirty-indicator">任务有未保存修改</span>':`${icon('clock')} ${state.savedAt?'已保存 '+state.savedAt:'当前任务仅保留在本次浏览'}`}</span>`;
 $('#action-panel').innerHTML=isPaint?`<button class="btn block ${state.generated?'':'primary'}" data-action="recognize">${icon('target')}识别保护区域</button><button class="btn block ${state.generated?'primary':''}" data-action="generate" style="margin-top:8px">${icon('file')}${state.generated?'更新二维图纸':'生成二维图纸'}</button><div class="hint">运行当前示例 · 保留人工修订</div>`:`<button class="btn block" data-action="wrap">${icon('layers')}生成包覆片体</button><button class="btn primary block" data-action="generate" style="margin-top:8px">${icon('scissors')}${state.generated?'更新展开图':'生成展开图'}</button><div class="hint">五面帽式示例 · 工艺参数需复核</div>`;
 $$('#view-tabs button').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));
 $$('.right-tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.rightTab));
 $('.scene-pane').classList.toggle('hidden',state.view==='2d');$('.drawing-pane').classList.toggle('hidden',state.view==='3d');
 $('#canvas-stage').classList.toggle('split-view',state.view==='split');$('#canvas-stage').classList.toggle('fixed-editing',!!state.fixedEditing);
 $('#selected-label').textContent=isPaint?(state.selectedObject==='panel'?'+Z 舱板内表面':{ 'unit-a':'TCU-01 · 控制单机','unit-b':'PCU-02 · 电源单机',bracket:'BRK-01 · 安装支架',pad:'PAD-01 · 隔热垫',boss:'安装凸台'}[state.selectedObject]||'+Z 舱板内表面'):`${faceNames[state.selectedFace]||'顶面'} · ${state.faces.includes(state.selectedFace)?'包覆面':'未包覆'}`;
 $('#drawing-state').innerHTML=state.dirty?'<span class="dirty-indicator">待更新</span>':chip(state.generated?'预览已生成':'交互预览',state.generated?'blue':'');
 $('#check-count').textContent=isPaint?drawing.stats.undetectedCount+(state.reviewed?0:1):state.reviewed?2:3;
 $$('.canvas-actions [data-action="dimensions"]').forEach(b=>b.classList.toggle('active',state.dimensions));
 $$('.canvas-actions [data-action="mask"]').forEach(b=>b.classList.toggle('active',state.maskVisible));
 $('[data-action="ghost"]').classList.toggle('active',state.ghost);
 $('[data-action="explode"]')?.classList.toggle('active',state.exploded);
 $('[data-action="undo"]').disabled=history.length===0;$('[data-action="redo"]').disabled=future.length===0;
 $('#statusbar').innerHTML=`<span class="left"><span><i class="dot"></i>示例工作区</span><span>${isPaint?'P-01 / +Z':'BAT-01 / '+state.faces.length+' FACES'}</span><span>单位：mm</span>${state.dirty?'<span style="color:#b69862">结果待更新</span>':''}</span><span class="right"><span>${isPaint?'接触面识别 / 喷漆保护':'包覆片体 / 裁切展开'}</span><span>CAD 服务未连接</span><span class="mono">V0.1</span></span>`;
 const selection=isPaint?(state.selectedId||state.selectedObject):state.selectedFace;
 scene.setState({selectedId:selection,dimensions:state.dimensions,maskVisible:state.maskVisible,bodiesVisible:state.bodiesVisible,ghost:state.ghost,exploded:state.exploded,allowance:state.allowance??5,paintMargin:state.margin??3,caseId:state.caseId,blanketFaces:state.faces,paintRegions:drawing.regions,fixedVisible:state.fixed,fixedPoints:state.fixedPoints,seam:state.seam,overlap:state.lap});
 try{sessionStorage.setItem(storageKey+'-draft',JSON.stringify({schema:1,mode,state,unsaved:dirtyEdit}));}catch{}
}
function select3d(id){if(isPaint&&id==='panel'){state.selectedObject='panel';state.selectedId=null;refresh();return;}if(isPaint){const exact=drawing.regions.find(r=>r.id===id);if(exact){state.selectedId=exact.id;state.selectedObject=exact.sourceId;}else {state.selectedObject=id;const first=drawing.regions.find(r=>r.sourceId===id);if(first)state.selectedId=first.id;}}else {if(id==='base'){toast('安装底面保持开口，不参与本次包覆。');return;}state.selectedFace=id;}refresh();}
function selectRegion(id){const r=drawing.regions?.find(r=>r.id===id);if(!r)return;state.selectedId=id;state.selectedObject=r.sourceId;refresh();}
function toggleRegion(id){const r=drawing.regions.find(r=>r.id===id);const excluded=state.excludedIds.includes(id);edit({excludedIds:excluded?state.excludedIds.filter(v=>v!==id):[...state.excludedIds,id]},`${excluded?'恢复':'人工排除'}保护区域 ${r.label}（${r.source}）`);toast(excluded?'已恢复规则处理。':'该区域已保留喷漆，图纸待更新。');}
function fixedPointClick(event,face){
 const svg=$('#drawing-stage svg'),p=drawing.panels.find(p=>p.id===face);if(!p?.svgBounds)return;
 const point=svg.createSVGPoint();point.x=event.clientX;point.y=event.clientY;const q=point.matrixTransform(svg.getScreenCTM().inverse());const b=p.svgBounds;
 const u=Math.min(.94,Math.max(.06,(q.x-b.x)/b.width)),v=Math.min(.94,Math.max(.06,(q.y-b.y)/b.height));
 const max=Math.max(0,...state.fixedPoints.map(p=>Number(p.id.split('-')[1])||0));const item={id:`FP-${String(max+1).padStart(2,'0')}`,face,u,v};
 edit({fixedPoints:[...state.fixedPoints,item],selectedFace:face},`在${faceNames[face]}添加固定点 ${item.id}`);toast(`已在${faceNames[face]}添加固定点；点击固定点可移除。`);
}
function removePoint(id){edit({fixedPoints:state.fixedPoints.filter(p=>p.id!==id)},`删除固定点 ${id}`);}

function download(content,name,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);}
function configuration(){return {schema:1,mode,exampleOnly:true,manufacturingReady:false,exportedAt:new Date().toISOString(),state,description:'热控图纸工作台前端交互样例配置；不含真实CAD解析结果。'};}
function modal(title,body,footer='<button class="btn primary" data-modal-close>知道了</button>'){$('#modal-root').innerHTML=`<div class="modal-backdrop"><section role="dialog" aria-modal="true" aria-labelledby="modal-title" class="modal"><div class="modal-header"><h2 id="modal-title">${title}</h2><button class="icon-btn" data-modal-close aria-label="关闭">${icon('close')}</button></div><div class="modal-content">${body}</div><div class="modal-footer">${footer}</div></section></div>`;$('#modal-root [data-modal-close]')?.focus();}
function about(){modal('热控图纸工作台 · 交互预览',`<p>这一版用参数化示例模型展示两个独立工作流，帮助评审工程师的选面、参数调整、结果查看和人工修订方式。</p><div class="badge-row">${chip('真实界面交互','blue')}${chip('参数化示例几何','blue')}${chip('SVG / JSON 导出','blue')}</div><h3>当前可以体验</h3><p>三维旋转与点选、三维 / 二维联动、区域保护规则、多层放量与搭接、固定点编辑、任务保存与预览下载。</p><h3>实际工程接入</h3><p>当前没有解析真实STEP/PRT/ASM，也没有执行真实装配接触计算或DWG出图。选择文件只在当前浏览器显示文件信息，不会上传。输出的SVG为样例预览，不能直接作为制造依据。</p><p>放量和体积比用于演示参数关系；工艺验收、材料适应性与现场试装仍需工程确认。</p>`);}
function help(){modal(isPaint?'喷漆图纸 · 快速体验':'多层图纸 · 快速体验',isPaint?`<h3>1. 查看接触与保护</h3><p>选择一个示例，拖动模型查看装配。切到“二维图纸”或“对照”，点击安装脚、孔洞和凸台，查看来源与当前处理。</p><h3>2. 调整规则与人工修订</h3><p>尝试把接触阈值从0.10改为0.05 mm，或将保护外扩从3改为5 mm。对不应保护的区域选择“人工排除”。人工修订会在重新识别时保留。</p><h3>3. 更新与复核</h3><p>点击“生成二维图纸”，查看质量检查。确认样例后，可以保存任务、导出矢量预览或参数配置。当前数值来自预置样例。</p>`:`<h3>1. 联动查看</h3><p>点击三维包覆面或二维裁片，对应对象同时高亮。左侧可调整参与包覆的面，安装底面保持开口。</p><h3>2. 修改包覆与搭接</h3><p>改变尺寸放量、搭接宽度，或切换搭接边归属。三维和二维几何会同步显示参数效果。</p><h3>3. 编辑固定点</h3><p>点击“在展开图上添加固定点”，再点击某一裁片增加固定点；点击已有点或侧栏中的×移除。最后更新展开图并导出预览。</p><p>小屏幕上可使用二维图纸页签编辑，三维视图可单独打开。</p>`);}
function showModel(){modal('模型与演示案例',`<p>${isPaint?'当前演示覆盖标准安装、支架接触和板边保护三个案例。':'当前演示为140 × 100 × 85 mm的盒状单机，支持五面帽式包覆。'}</p>${isPaint?`<label>选择演示案例<select class="select" id="modal-case" style="margin-top:9px">${Object.entries(caseNames).map(([k,v])=>`<option value="${k}" ${state.caseId===k?'selected':''}>${v}</option>`).join('')}</select></label>`:''}<h3>导入真实模型</h3><p>可选择STEP、PRT或ASM查看文件信息。当前前端尚未接入CAD解析，选择真实模型不会替换展示中的样例几何。</p>`, `<button class="btn" data-modal-action="upload">${icon('upload')}选择文件</button><button class="btn primary" data-modal-close>返回工作台</button>`);}
function run(kind){
 if(!isPaint&&state.faces.length===0){toast('请先选择至少一个包覆面。');return;}
 const button=$(`[data-action="${kind}"]`);if(button){button.classList.add('busy');button.innerHTML=icon('refresh','spin')+'正在更新示例';}
 setTimeout(()=>{
  remember();state.reviewed=false;dirtyEdit=true;
  if(kind==='recognize'){state.recognized=true;state.dirty=true;log(`按 ${state.contactTolerance} mm 阈值更新样例接触识别`);toast(`样例识别已更新：${drawing.stats.activeCount} 个保护区域，保留 ${state.excludedIds.length} 处人工排除。`);}
  else if(kind==='wrap'){state.wrapped=true;state.dirty=true;state.view='split';log(`生成 ${state.faces.length} 面包覆片体，尺寸放量 ${state.allowance}%`);toast('样例包覆片体已更新，可继续调整搭接与固定点。');}
  else {state.generated=true;state.dirty=false;state.view=isPaint?'2d':'split';state.fixedEditing=false;log(isPaint?'生成当前参数的二维保护图纸':'更新当前参数的多层展开图');toast(isPaint?'二维保护图预览已更新，请继续人工复核。':'三维包覆与二维展开已同步，请复核接缝和固定点。');}
  refresh();
 },430);
}

async function action(name,button){
 switch(name){
  case 'about':about();break;case 'help':help();break;case 'model':showModel();break;case 'upload':$('#model-file').click();break;
  case 'save':try{const savedAt=stamp();localStorage.setItem(storageKey,JSON.stringify({...configuration(),state:{...state,savedAt}}));state.savedAt=savedAt;dirtyEdit=false;refresh();toast('当前任务已保存到此浏览器，重新打开可继续。');}catch{toast('当前浏览器无法保存，请导出JSON配置。');}break;
  case 'export-menu':$('#export-menu').classList.toggle('open');button?.setAttribute('aria-expanded',$('#export-menu').classList.contains('open'));break;
  case 'export-svg':download(drawing.svg,`${mode}-demo-preview.svg`,'image/svg+xml;charset=utf-8');toast('已导出当前二维样例SVG。');break;
  case 'export-3d':download(scene.getSVG(),`${mode}-demo-model-view.svg`,'image/svg+xml;charset=utf-8');toast('已导出当前三维视图SVG。');break;
  case 'export-json':download(JSON.stringify(configuration(),null,2),`${mode}-task-config.json`,'application/json');toast('已导出任务参数与修订记录。');break;
  case 'undo':if(history.length){future.push(structuredClone(state));state=history.pop();dirtyEdit=true;refresh();toast('已撤销上一步修改。');}break;
  case 'redo':if(future.length){history.push(structuredClone(state));state=future.pop();dirtyEdit=true;refresh();toast('已重做修改。');}break;
  case 'dimensions':state.dimensions=!state.dimensions;refresh();break;
  case 'mask':state.maskVisible=!state.maskVisible;refresh();break;
  case 'bodies':state.bodiesVisible=!state.bodiesVisible;refresh();break;
  case 'ghost':state.ghost=!state.ghost;refresh();break;
  case 'explode':state.exploded=!state.exploded;refresh();break;
  case 'drawing-zoom-in':drawingZoom=Math.min(2.5,drawingZoom+.2);$('#drawing-stage svg').style.transform=`scale(${drawingZoom})`;break;case 'drawing-zoom-out':drawingZoom=Math.max(.6,drawingZoom-.2);$('#drawing-stage svg').style.transform=`scale(${drawingZoom})`;break;case 'drawing-fit':drawingZoom=1;$('#drawing-stage svg').style.transform='scale(1)';break;case 'zoom-in':scene.zoom(.16);break;case 'zoom-out':scene.zoom(-.16);break;case 'fit':scene.fit();drawingZoom=1;refresh();break;
  case 'fullscreen':$('.shell').classList.toggle('viewer-full');setTimeout(()=>scene.fit(),80);break;
  case 'recognize':case 'wrap':case 'generate':run(name);break;
  case 'review':if(state.dirty||!state.generated){toast('请先更新当前图纸预览。');return;}state.reviewed=!state.reviewed;dirtyEdit=true;log(state.reviewed?'人工标记样例已复核':'取消样例复核标记');refresh();toast(state.reviewed?'已记录样例复核，不代表真实CAD或制造验收。':'已取消复核标记。');break;
  case 'reset-regions':if(!state.excludedIds.length){toast('当前没有人工排除项。');return;}edit({excludedIds:[]},'恢复所有人工排除的保护区域');toast('人工排除项已恢复，图纸待更新。');break;
  case 'fixed-mode':state.fixedEditing=!state.fixedEditing;state.fixed=true;state.maskVisible=true;if(state.fixedEditing)state.view='2d';refresh();if(state.fixedEditing)toast('点击裁片添加固定点；点击已有固定点移除。');break;
  case 'history':modal('操作记录',`<p>记录当前任务中的参数变更和人工修订，保存任务时一起保留。</p><div class="history-list">${state.log.length?state.log.map(item=>`<div class="history-entry"><span class="mono">${esc(item.at)}</span><span>${esc(item.message)}</span></div>`).join(''):'<p>尚无修改记录。调整参数或修订区域后会显示在这里。</p>'}</div>`);break;
 }
 if(name!=='export-menu'&&name.startsWith('export-')){$('#export-menu').classList.remove('open');$('[data-action="export-menu"]').setAttribute('aria-expanded','false');}
}

document.addEventListener('click',e=>{
 const close=e.target.closest('[data-modal-close]');if(close||e.target.classList.contains('modal-backdrop')){$('#modal-root').innerHTML='';return;}
 const ma=e.target.closest('[data-modal-action]');if(ma){if(ma.dataset.modalAction==='upload')$('#model-file').click();return;}
 const point=e.target.closest('[data-remove-point]');if(point){removePoint(point.dataset.removePoint);return;}
 const shown=e.target.closest('[data-fixed-point]');if(shown&&!isPaint){if(state.fixedEditing){removePoint(shown.dataset.fixedPoint);toast('固定点已移除。');}else{state.selectedFace=shown.dataset.face;refresh();}return;}
 const toggle=e.target.closest('[data-toggle-region]');if(toggle){toggleRegion(toggle.dataset.toggleRegion);return;}
 const a=e.target.closest('[data-action]');if(a){action(a.dataset.action,a);return;}
 if(!e.target.closest('.export-wrap')){$('#export-menu')?.classList.remove('open');$('[data-action="export-menu"]')?.setAttribute('aria-expanded','false');}
 const view=e.target.closest('[data-view]');if(view){state.view=view.dataset.view;refresh();return;}
 const tab=e.target.closest('[data-tab]');if(tab){state.rightTab=tab.dataset.tab;refresh();return;}
 const camera=e.target.closest('[data-camera]');if(camera){scene.setView(camera.dataset.camera);return;}
 const obj=e.target.closest('[data-object]');if(obj){select3d(obj.dataset.object);return;}
 const filter=e.target.closest('[data-filter]');if(filter){state.filter=filter.dataset.filter;refresh();return;}
 const region=e.target.closest('[data-region]');if(region&&isPaint){selectRegion(region.dataset.region);return;}
 const face=e.target.closest('[data-face]');if(face&&!isPaint&&!e.target.closest('[data-face-toggle]')){if(face.closest('label.face-checkbox'))return;if(state.fixedEditing&&face.closest('#drawing-stage')&&!e.target.closest('[data-fixed-point]'))fixedPointClick(e,face.dataset.face);else{state.selectedFace=face.dataset.face;refresh();}return;}
});
document.addEventListener('change',async e=>{
 const el=e.target;
 if(el.matches('[data-param]')){const key=el.dataset.param;const value=el.type==='checkbox'?el.checked:Math.min(Number(el.max),Math.max(Number(el.min),Number(el.value)||Number(el.min)));const message=`${el.closest('label')?.querySelector('span')?.textContent||key}调整为 ${value}`;if(state[key]===value&&el.dataset.editing){log(message);refresh();}else edit({[key]:value},message);}
 else if(el.matches('[data-range]')){log(`${el.dataset.range==='margin'?'边界外扩距离':'尺寸放量比例'}调整为 ${state[el.dataset.range]}`);refresh();}
 else if(el.id==='case-select'||el.id==='modal-case'){if(!isPaint)return;edit({caseId:el.value,selectedId:'unit-a-1',selectedObject:'panel',excludedIds:[],generated:false,reviewed:false},`切换示例：${caseNames[el.value]}`);scene.fit();toast('已切换示例模型；原案例结果已更新。');}
 else if(el.id==='region-treatment'){if((el.value==='exclude')!==state.excludedIds.includes(state.selectedId))toggleRegion(state.selectedId);}
 else if(el.name==='seam'){edit({seam:el.value},'调整搭接边归属，固定点需复核');}
 else if(el.matches('[data-face-toggle]')){const face=el.dataset.faceToggle;const faces=el.checked?[...state.faces,face]:state.faces.filter(f=>f!==face);edit({faces,selectedFace:el.checked?face:faces[0]||'top'},`${el.checked?'加入':'移除'}包覆面：${faceNames[face]}`);}
 else if(el.id==='model-file'&&el.files?.[0]){
  const f=el.files[0];currentUpload={name:f.name,size:f.size};
  if(f.name.toLowerCase().endsWith('.json')){try{if(f.size>1000000)throw new Error('large');const data=JSON.parse(await f.text());if(data.schema!==1||data.mode!==mode||!data.state)throw new Error('invalid');const s=data.state;
    const numeric=isPaint?['margin','contactTolerance']:['allowance','lap'];if(numeric.some(k=>!Number.isFinite(s[k])))throw new Error('invalid');
    remember();state=cleanState(s);dirtyEdit=true;
    log('载入任务配置');$('#modal-root').innerHTML='';refresh();toast('任务配置已载入。');
   }catch{toast('配置文件无效，或不属于当前功能页面。');}el.value='';return;}
  modal('模型文件已选择',`<div class="upload-pending"><strong>${esc(f.name)}</strong><br>${(f.size/1024/1024).toFixed(2)} MB · 等待CAD解析服务</div><p>当前版本仅展示本地文件信息，文件不会上传。工作台继续显示原有演示案例。</p><p>接入模型解析后，这里将读取真实装配结构、表面和坐标，随后执行对应工程流程。</p>`,`<button class="btn primary" data-modal-close>继续查看示例</button>`);el.value='';
 }
});
document.addEventListener('input',e=>{const el=e.target;if(el.matches('[data-param][type="number"]')){if(el.value===''||!Number.isFinite(Number(el.value)))return;const key=el.dataset.param;if(!el.dataset.editing){remember();el.dataset.editing='1';}state[key]=Math.min(Number(el.max),Math.max(Number(el.min),Number(el.value)));dirtyEdit=true;state.dirty=true;state.reviewed=false;const range=$(`[data-range="${key}"]`);if(range)range.value=state[key];if(key==='allowance'&&$('#ratio-label'))$('#ratio-label').textContent=(1+state.allowance/100).toFixed(3);refresh({skipRight:true});return;}if(!el.matches('[data-range]'))return;const key=el.dataset.range;if(!el.dataset.dragging){remember();el.dataset.dragging='1';}state[key]=Number(el.value);dirtyEdit=true;state.dirty=true;state.reviewed=false;const input=$(`[data-param="${key}"]`);if(input)input.value=state[key];if(key==='allowance'&&$('#ratio-label'))$('#ratio-label').textContent=(1+state.allowance/100).toFixed(3);refresh({skipRight:true});});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#modal-root').innerHTML='';$('#export-menu')?.classList.remove('open');if(state.fixedEditing){state.fixedEditing=false;refresh();}}if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-region],[data-face],[data-object]')){e.preventDefault();e.target.click();}});
mount();

})();
</script></body></html>
